name: m1 smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      # One build: the bundle-size budgets first, then the smoke.
      - run: pnpm bench:smoke --check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  two-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv two-tab
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  kill-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      # The probes, then each kill kind once. The nightly workflow runs 30 minutes.
      - run: pnpm --filter @opfs-lsm/kv kill-chrome --seed 1 --iterations 6
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # IndexedDB put back to an older copy while OPFS keeps its files.
      - run: pnpm --filter @opfs-lsm/kv power-loss-chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:docs
      - run: pnpm deadcode

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p engine-core

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv formal:kv
