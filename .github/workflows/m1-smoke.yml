name: m1 smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      # One build: the bundle-size budgets first, then the smoke.
      - run: pnpm bench:smoke --check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  two-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv two-tab
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  kill-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      # The probes, then each kill kind once. The nightly workflow runs 30 minutes.
      - run: pnpm --filter @opfs-lsm/kv kill-chrome --seed 1 --iterations 6
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # IndexedDB put back to an older copy while OPFS keeps its files.
      - run: pnpm --filter @opfs-lsm/kv power-loss-chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  test:
    runs-on: ubuntu-latest
    # A wasm engine that corrupts its own heap tends to hang rather than fail.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The wasm engine on its checked twin, against the build at the merge-base,
  # and under each Jazzer.js engine target for a minute (docs/verification.md).
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge-base with origin/main, and the trailers of the commits after it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv build:wasm-checked
      - name: the kv suite on the checked twin
        run: pnpm --filter @opfs-lsm/kv test
        env:
          KV_ENGINE: checked
      - name: the gate against the merge-base
        run: pnpm --filter @opfs-lsm/kv engine:gate
      - name: each engine fuzz target for 60 s
        run: for t in engine-encode engine-scan engine-merge; do pnpm --filter @opfs-lsm/kv fuzz:jazzer "$t" 60 || exit 1; done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-findings
          path: packages/kv/fuzz/.build/crash-*
          if-no-files-found: ignore

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:engine
      - run: pnpm check:docs
      - run: pnpm deadcode

  wasm-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The lockfile installs assemblyscript 0.28.20, the compiler of the committed
      # binary, and packages/kv/engine/build.sh refuses any other version.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv build:wasm
      - run: git diff --exit-code packages/kv/wasm/engine.wasm || { echo "::error::packages/kv/wasm/engine.wasm does not match packages/kv/engine. Run 'pnpm --filter @opfs-lsm/kv build:wasm' and commit packages/kv/wasm/engine.wasm."; exit 1; }

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv formal:kv
