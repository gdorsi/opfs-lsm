name: m1 smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      # One build: the bundle-size budgets first, then the smoke.
      - run: pnpm bench:smoke --check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  two-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv two-tab
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  kill-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      # The probes, then each kill kind once. The nightly workflow runs 30 minutes.
      - run: pnpm --filter @opfs-lsm/kv kill-chrome --seed 1 --iterations 6
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # IndexedDB put back to an older copy while OPFS keeps its files.
      - run: pnpm --filter @opfs-lsm/kv power-loss-chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:docs
      - run: pnpm deadcode

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig fmt --check packages/kv/engine/src
      - run: zig test packages/kv/engine/src/test.zig

  wasm-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Zig and binaryen as the committed binary. A Zig or binaryen bump
      # changes the bytes: rebuild with the new versions, update these lines and
      # packages/kv/engine/build.sh, and commit packages/kv/wasm/engine.wasm.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: sh packages/kv/engine/build.sh
      - run: git diff --exit-code packages/kv/wasm/engine.wasm || { echo "::error::packages/kv/wasm/engine.wasm does not match the Zig source. Run 'sh packages/kv/engine/build.sh' and commit packages/kv/wasm/engine.wasm."; exit 1; }

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-lsm/kv formal:kv
