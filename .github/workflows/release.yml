name: release

# On every push to main, changesets/action either opens a "Version packages"
# pull request from the pending .changeset/*.md files, or, once that pull
# request is merged, publishes the new versions to npm with provenance.
# See CONTRIBUTING.md.
# Disabled until the packages are ready to publish. To turn releases back on,
# restore the push trigger below and delete the workflow_dispatch line.
on:
  workflow_dispatch:
#  push:
#    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm static
      - uses: changesets/action@v1
        with:
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
