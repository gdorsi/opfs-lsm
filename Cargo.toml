[workspace]
resolver = "2"
members = ["crates/engine-core", "crates/engine-wasm"]
# Needs nightly and libFuzzer: `cargo +nightly fuzz` (docs/verification.md).
exclude = ["crates/engine-core/fuzz"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The hot code keeps opt-level 3: at "z" lz4_flex's decoder and the merge run
# at half speed for 2.6 kB of gzip. The binding crate and std stay at "z".
[profile.release.package.lz4_flex]
opt-level = 3

[profile.release.package.engine-core]
opt-level = 3
