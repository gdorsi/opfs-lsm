<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <script type="importmap">
      {
        "imports": {
          "@opfs-lsm/kv": "../../packages/kv/dist/index.js",
          "@opfs-lsm/collections": "../../packages/collections/dist/index.js"
        }
      }
    </script>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.4;
        color: #1c1915;
        background: #f6f4ef;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.25rem;
      }
      .lede,
      #status,
      #generation,
      #progress {
        margin: 0.25rem 0;
        color: #4a453d;
      }
      #progress {
        min-height: 1.4em;
      }
      #error {
        min-height: 1.4em;
        margin: 0.5rem 0 0;
        color: #9b1c1c;
      }
      form.row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      form.row label {
        grid-column: 1 / -1;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.5rem;
        margin: 1rem 0 0.5rem;
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0.5rem 0 1rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin: 1.5rem 0;
      }
      input[type="text"],
      input[type="search"],
      input[type="number"] {
        flex: 1;
        font: inherit;
        padding: 0.45rem 0.6rem;
        min-width: 0;
      }
      select {
        font: inherit;
        padding: 0.45rem 0.5rem;
      }
      button {
        font: inherit;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid #e4dfd6;
      }
      li label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        min-width: 0;
      }
      li span {
        overflow-wrap: anywhere;
      }
      .done {
        text-decoration: line-through;
        color: #6b6560;
      }
      #empty {
        color: #6b6560;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <p class="lede">Shared list. Open a second window to see the same rows.</p>
      <p id="status" aria-live="polite">opening</p>
      <p id="generation"></p>
      <p id="progress"></p>
      <p id="error" role="alert"></p>
      <form id="add" class="row">
        <label for="title">New todo</label>
        <input id="title" name="title" type="text" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <form id="generate" class="row">
        <label for="count">Generate random todos</label>
        <input
          id="count"
          name="count"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          value="1000"
        />
        <button id="generate-button" type="submit">Generate</button>
      </form>
      <div class="toolbar">
        <input
          id="filter"
          type="search"
          autocomplete="off"
          placeholder="Filter todos"
          aria-label="Filter todos"
        />
        <select id="sort" aria-label="Sort todos">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="title">Title A–Z</option>
        </select>
        <button id="clear" type="button">Clear all</button>
      </div>
      <nav class="pager" aria-label="Pages">
        <button id="prev" type="button">Prev</button>
        <span id="page" aria-live="polite">Page 1</span>
        <button id="next" type="button">Next</button>
      </nav>
      <ul id="list"></ul>
      <p class="actions">
        <button id="ingest" type="button">Ingest</button>
        <button id="other" type="button">Open second window</button>
      </p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
