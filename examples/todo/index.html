<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <script type="importmap">
      {
        "imports": {
          "@opfs-lsm/kv": "../../packages/kv/dist/index.js"
        }
      }
    </script>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.4;
        color: #1c1915;
        background: #f6f4ef;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.25rem;
      }
      .lede,
      #status,
      #generation {
        margin: 0.25rem 0;
        color: #4a453d;
      }
      #error {
        min-height: 1.4em;
        margin: 0.5rem 0 0;
        color: #9b1c1c;
      }
      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      form label {
        grid-column: 1 / -1;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      input[type="text"] {
        flex: 1;
        font: inherit;
        padding: 0.45rem 0.6rem;
      }
      button {
        font: inherit;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid #e4dfd6;
      }
      li label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
      }
      .done {
        text-decoration: line-through;
        color: #6b6560;
      }
      #empty {
        color: #6b6560;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <p class="lede">Shared list. Open a second window to see the same rows.</p>
      <p id="status" aria-live="polite">opening</p>
      <p id="generation"></p>
      <p id="error" role="alert"></p>
      <form id="add">
        <label for="title">New todo</label>
        <input id="title" name="title" type="text" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <ul id="list"></ul>
      <p class="actions">
        <button id="ingest" type="button">Ingest</button>
        <button id="other" type="button">Open second window</button>
      </p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
