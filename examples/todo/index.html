<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.4;
        color: #1c1915;
        background: #f6f4ef;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.25rem;
      }
      .lede,
      #status,
      #progress {
        margin: 0.25rem 0;
        color: #4a453d;
      }
      #progress {
        min-height: 1.4em;
      }
      #error {
        min-height: 1.4em;
        margin: 0.5rem 0 0;
        color: #9b1c1c;
      }
      form.row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      form.row label {
        grid-column: 1 / -1;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.5rem;
        margin: 1rem 0 0.5rem;
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0.5rem 0 1rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin: 1.5rem 0;
      }
      input[type="text"],
      input[type="search"],
      input[type="number"] {
        flex: 1;
        font: inherit;
        padding: 0.45rem 0.6rem;
        min-width: 0;
      }
      select {
        font: inherit;
        padding: 0.45rem 0.5rem;
      }
      button {
        font: inherit;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid #e4dfd6;
      }
      li label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        min-width: 0;
      }
      li span {
        overflow-wrap: anywhere;
      }
      .done {
        text-decoration: line-through;
        color: #6b6560;
      }
      #empty {
        color: #6b6560;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- Static shell painted while the store opens the database (module-level
         top-level await) and reads the first page. React replaces it wholesale. -->
    <div id="root">
      <main>
        <h1>Todos</h1>
        <p id="status" aria-live="polite">opening</p>
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
